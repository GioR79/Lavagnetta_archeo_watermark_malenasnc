<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Lavagnetta Watermark</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:620px;margin:auto;padding:18px 15px 40px}
.sub,.note{color:#a1a1a6;font-size:13px;line-height:1.35}
.card{background:#1d1d1f;border:1px solid #38383a;border-radius:18px;padding:15px;margin:12px 0}
h1{font-size:24px;margin:0 0 4px}
label{display:block;color:#a1a1a6;font-size:11px;text-transform:uppercase;margin-bottom:6px}
input{width:100%;padding:11px;border-radius:11px;border:1px solid #48484a;background:#2c2c2e;color:white;font-size:19px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{width:100%;border:0;border-radius:12px;padding:13px 10px;background:#2c2c2e;color:white;font-size:17px;font-weight:700}
button.active{background:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.28)}
button.primary{background:#0a84ff;font-size:18px}
.hidden{display:none}
.preview{position:relative;margin-top:9px;overflow:hidden;border-radius:14px;background:#000;min-height:220px;display:flex;align-items:center;justify-content:center}
.preview img{width:100%;display:block}
.empty{padding:60px 20px;text-align:center;color:#777}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#2c2c2e;color:#ddd;font-size:13px;margin-top:8px}
#cameraView{width:100%;background:#000}
.videoWrap{position:relative}
.videoWrap video{width:100%;display:block}
.overlay{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.68);padding:10px 12px;border-radius:10px;font-weight:700}
.cameraBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.photoNumberRow{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:9px;margin-top:8px}
#photoInput{text-align:center;font-size:24px;font-weight:800;padding:9px;min-width:0}
</style>
</head>
<body>
<main>
<h1>📷 Lavagnetta Watermark</h1>
<div class="sub">Imposta TR + sezione, inquadra, scatta e ottieni subito la foto con watermark.</div>

<div class="card">
<label>Cantiere</label><input id="cantiere" value="MN.C930, ARD26">
<div style="height:9px"></div><div class="row">
<div><label>Lotto</label><input id="lotto" value="LOTTO B"></div>
<div><label>Data</label><input id="data" readonly></div>
</div>
</div>

<div class="card">
<label>Trincea</label><input id="trincea" value="TR 13">
<div style="height:10px"></div><label>Sezione</label>
<div class="row">
<button data-sec="NORD">NORD</button><button data-sec="SUD">SUD</button>
<button data-sec="EST">EST</button><button data-sec="OVEST">OVEST</button><button data-sec="GENERALE">GENERALE</button>
</div>
<div id="selected" class="badge"></div>
</div>

<div class="card">
<label>Prossima foto</label>
<div style="text-align:center;font-size:30px;font-weight:800" id="fotoView">F1</div>
<div class="photoNumberRow">
<button id="minus">−</button>
<input id="photoInput" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Numero foto" value="1">
<button id="plus">＋</button>
</div>
<div class="note" style="margin-top:8px;text-align:center">Usa − / + oppure inserisci direttamente il numero.</div>
</div>

<div class="card">
<button class="primary" id="start">📷 INQUADRA E SCATTA</button>
<div id="cameraPanel" class="hidden" style="margin-top:10px">
<div class="videoWrap"><video id="video" autoplay playsinline></video><div class="overlay" id="liveOverlay"></div></div>
<div class="cameraBtns"><button id="capture">● SCATTA</button><button id="closeCamera">CHIUDI</button></div>
</div>
<div id="status" class="note" style="margin-top:9px">La fotocamera richiede HTTPS e il permesso del browser.</div>
</div>

<div class="card">
<label>Ultimo risultato</label>
<div class="preview" id="preview"><div class="empty">Qui apparirà la foto con watermark.</div></div>
<button id="save" class="primary hidden" style="margin-top:10px">⬇︎ SALVA FOTO</button>
</div>
</main>

function today(){
 const d=new Date();
 return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
}
$("data").value=today();

const s=JSON.parse(localStorage.getItem("lw")||"null");
if(s){
 $("cantiere").value=s.c||$("cantiere").value;
 $("lotto").value=s.l||$("lotto").value;
 $("trincea").value=s.t||$("trincea").value;
 section=s.s||section;
 photo=s.f??photo;
}

function saveState(){
 localStorage.setItem("lw",JSON.stringify({
   c:$("cantiere").value,l:$("lotto").value,t:$("trincea").value,s:section,f:photo
 }));
}

function render(){
 $("selected").textContent="✓ "+section;
 $("fotoView").textContent="F"+photo;
 if(document.activeElement!==$("photoInput")) $("photoInput").value=photo;
 document.querySelectorAll("[data-sec]").forEach(b=>b.classList.toggle("active",b.dataset.sec===section));
 $("liveOverlay").textContent=$("trincea").value+" · S "+section+" · F"+photo+" · "+$("data").value;
 saveState();
}

function applyPhotoInput(){
 let v=$("photoInput").value.trim().replace(/^F/i,"");
 let n=parseInt(v,10);
 if(Number.isFinite(n)&&n>=1){ photo=n; render(); }
 else { $("photoInput").value=photo; }
}

document.querySelectorAll("input").forEach(x=>x.addEventListener("input",()=>{
 if(x.id!=="photoInput") render();
}));
$("photoInput").addEventListener("change",applyPhotoInput);
$("photoInput").addEventListener("blur",applyPhotoInput);
$("photoInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); applyPhotoInput(); e.target.blur(); }});

document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{section=b.dataset.sec;render()});
$("plus").onclick=()=>{photo++;render()};
$("minus").onclick=()=>{photo=Math.max(1,photo-1);render()};

async function openCamera(){
 $("status").textContent="Richiesta accesso alla fotocamera…";
 if(!navigator.mediaDevices?.getUserMedia){
   $("status").textContent="Fotocamera non disponibile. Apri l'app da HTTPS.";
   return;
 }
 try{
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
   $("video").srcObject=stream;
   $("cameraPanel").classList.remove("hidden");
   $("start").classList.add("hidden");
   $("status").textContent="Fotocamera attiva.";
 }catch(e){
   $("status").textContent="Accesso fotocamera non riuscito: "+e.name+". Controlla i permessi.";
 }
}

function closeCamera(){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 $("video").srcObject=null;
 $("cameraPanel").classList.add("hidden");
 $("start").classList.remove("hidden");
}

$("start").onclick=openCamera;
$("closeCamera").onclick=closeCamera;

$("capture").onclick=()=>{
 const v=$("video"),c=document.createElement("canvas");
 c.width=v.videoWidth;c.height=v.videoHeight;
 c.getContext("2d").drawImage(v,0,0);
 c.toBlob(b=>applyWatermark(b),"image/jpeg",.94);
 closeCamera();
};

async function applyWatermark(file){
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{
   const c=document.createElement("canvas");
   c.width=img.naturalWidth;c.height=img.naturalHeight;
   const x=c.getContext("2d");
   x.drawImage(img,0,0);

   const w=img.naturalWidth,h=img.naturalHeight;
   const box=Math.round(Math.min(w,h)*0.25);
   const margin=Math.round(Math.min(w,h)*0.025);
   const radius=Math.round(box*0.08);
   const top=margin,left=margin;

   x.save();
   x.fillStyle="rgba(0,0,0,.68)";
   x.beginPath();
   x.roundRect(left,top,box,box,radius);
   x.fill();

   const pad=Math.round(box*.075);
   const fs1=Math.max(12,Math.round(box*.105));
   const fs2=Math.max(11,Math.round(box*.095));
   const fs3=Math.max(12,Math.round(box*.115));
   const fs4=Math.max(10,Math.round(box*.085));
   x.fillStyle="#fff";
   x.textBaseline="top";
   x.font=`700 ${fs1}px -apple-system,Arial`;
   x.fillText($("cantiere").value,left+pad,top+pad);
   x.font=`700 ${fs2}px -apple-system,Arial`;
   x.fillText($("lotto").value,left+pad,top+pad+Math.round(box*.22));
   x.font=`800 ${fs3}px -apple-system,Arial`;
   x.fillText($("trincea").value+" S "+section,left+pad,top+pad+Math.round(box*.43));
   x.font=`700 ${fs4}px -apple-system,Arial`;
   x.fillText("F"+photo+"  "+$("data").value,left+pad,top+pad+Math.round(box*.66));
   x.restore();

   const logoImg=new Image();
   logoImg.onload=()=>{
     const logoW=Math.round(Math.min(w,h)*.105);
     const logoH=Math.round(logoW*logoImg.naturalHeight/logoImg.naturalWidth);
     const lx=w-margin-logoW, ly=margin;
     x.save();
     x.globalAlpha=.65;
     x.drawImage(logoImg,lx,ly,logoW,logoH);
     x.restore();

     c.toBlob(b=>{
       URL.revokeObjectURL(url);
       resultBlob=b;
       $("preview").innerHTML="";
       const im=document.createElement("img");
       im.src=URL.createObjectURL(b);
       $("preview").appendChild(im);
       $("save").classList.remove("hidden");
       $("status").textContent="✓ Watermark applicato a F"+photo;
       photo++;
       render();
     },"image/jpeg",.94);
   };
   logoImg.src=LOGO;
 };
 img.src=url;
}

$("save").onclick=()=>{
 if(!resultBlob)return;
 const a=document.createElement("a");
 const n=photo-1;
 a.href=URL.createObjectURL(resultBlob);
 a.download="F"+n+"_"+$("trincea").value.trim().replace(/\s+/g,"_")+".jpg";
 a.click();
};

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
